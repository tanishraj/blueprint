name: Publish to npm

on:
  push:
    branches:
      - develop

permissions:
  contents: read

jobs:
  publish:
    if: github.ref == 'refs/heads/develop'
    name: Validate and publish package
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          registry-url: 'https://registry.npmjs.org'
          cache: yarn
          cache-dependency-path: yarn.lock

      - name: Install dependencies
        run: yarn install --frozen-lockfile

      - name: Run lint
        run: npm run lint

      - name: Run type-check
        run: npm run type-check

      - name: Run unit tests
        run: npm run test -- --run

      - name: Build package
        run: npm run build 2>&1 | tee /tmp/build.log

      - name: Acknowledge known LightningCSS warnings
        run: |
          if grep -q "Unknown at rule: @theme\|Unknown at rule: @utility" /tmp/build.log; then
            echo "Known warning detected: LightningCSS does not recognize @theme/@utility directives with this setup."
            echo "This is expected with Tailwind CSS v4 directives and is non-blocking."
          fi

      - name: Compute publish dist-tag
        id: dist_tag
        run: |
          echo "tag=next" >> "$GITHUB_OUTPUT"

      - name: Publish package
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          npm config set //registry.npmjs.org/:_authToken=${NODE_AUTH_TOKEN}
          npm whoami
          npm publish --access public --tag "${{ steps.dist_tag.outputs.tag }}"
