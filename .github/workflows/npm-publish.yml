name: Publish to npm

on:
  release:
    types:
      - published

permissions:
  contents: read

jobs:
  publish:
    if: github.event_name == 'release'
    name: Validate and publish package
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 1

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 20
          registry-url: 'https://registry.npmjs.org'
          cache: yarn
          cache-dependency-path: yarn.lock

      - name: Install dependencies
        run: yarn install --frozen-lockfile

      - name: Run lint
        run: npm run lint

      - name: Run type-check
        run: npm run type-check

      - name: Run unit tests
        run: npm run test -- --run

      - name: Build package
        run: npm run build 2>&1 | tee /tmp/build.log

      - name: Validate release source
        run: |
          if [ "${{ github.event.release.target_commitish }}" != "develop" ]; then
            echo "::error::Release publish is only allowed from the develop branch. Current target: ${{ github.event.release.target_commitish }}"
            exit 1
          fi

      - name: Acknowledge known LightningCSS warnings
        run: |
          if grep -q "Unknown at rule: @theme\|Unknown at rule: @utility" /tmp/build.log; then
            echo "Known warning detected: LightningCSS does not recognize @theme/@utility directives with this setup."
            echo "This is expected with Tailwind CSS v4 directives and is non-blocking."
          fi

      - name: Compute publish dist-tag
        id: dist_tag
        run: |
          RELEASE_TAG="${{ github.event.release.tag_name }}"
          RELEASE_VERSION="${RELEASE_TAG#v}"
          PACKAGE_VERSION="$(node -p "require('./package.json').version")"

          if [ "$RELEASE_VERSION" != "$PACKAGE_VERSION" ]; then
            echo "::error::Release tag '$RELEASE_TAG' does not match package.json version '$PACKAGE_VERSION'"
            exit 1
          fi

          if [ "${{ github.event.release.prerelease }}" = "true" ]; then
            echo "tag=next" >> "$GITHUB_OUTPUT"
          else
            echo "tag=latest" >> "$GITHUB_OUTPUT"
          fi

      - name: Publish package
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          npm config set //registry.npmjs.org/:_authToken=${NODE_AUTH_TOKEN}
          npm whoami
          npm publish --access public --tag "${{ steps.dist_tag.outputs.tag }}"
