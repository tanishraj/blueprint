name: Code Reviewer

on:
  pull_request:
    types:
      - opened
      - synchronize
      - reopened

permissions:
  contents: read
  issues: write
  pull-requests: write

concurrency:
  group: code-reviewer-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  review:
    name: PR review summary
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: yarn
          cache-dependency-path: yarn.lock

      - name: Install dependencies
        run: yarn install --frozen-lockfile

      - name: Run ESLint
        id: lint
        run: npm run lint
        continue-on-error: true

      - name: Run TypeScript type check
        id: type_check
        run: npm run type-check
        continue-on-error: true

      - name: Post PR review summary
        if: always()
        uses: actions/github-script@v7
        env:
          LINT_OUTCOME: ${{ steps.lint.outcome }}
          TYPECHECK_OUTCOME: ${{ steps.type_check.outcome }}
        with:
          script: |
            const lintPassed = process.env.LINT_OUTCOME === 'success';
            const typeCheckPassed = process.env.TYPECHECK_OUTCOME === 'success';

            const checks = [
              { name: 'ESLint', passed: lintPassed },
              { name: 'Type Check', passed: typeCheckPassed },
            ];

            const failedChecks = checks.filter(check => !check.passed);
            const status = failedChecks.length === 0 ? '✅ All checks passed' : '⚠️ Review findings found';

            const checklist = checks
              .map(check => `- ${check.passed ? '✅' : '❌'} ${check.name}`)
              .join('\n');

            const details = failedChecks.length
              ? '\n\nPlease fix the above failing checks and push an update.'
              : '\n\nGood to go — the PR is clean from lint and type-check.';

            const body = `## Code Reviewer Summary\n\n${status}\n\n${checklist}${details}\n\n*Generated by Code Reviewer workflow*`;

            const { data: comments } = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
            });

            const existing = comments.find(comment =>
              comment.user?.login === 'github-actions[bot]' &&
              comment.body?.startsWith('## Code Reviewer Summary')
            );

            if (existing) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: existing.id,
                body,
              });
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                body,
              });
            }

            if (failedChecks.length > 0) {
              core.setFailed('Code Reviewer found failing checks.');
            }
