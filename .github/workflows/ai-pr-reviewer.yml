name: AI PR Reviewer

on:
  workflow_dispatch:
    inputs:
      pr_number:
        description: 'Pull request number (required to run on PR context)'
        required: true
        type: string

permissions:
  contents: read
  pull-requests: read
  checks: write

jobs:
  review:
    name: AI PR Review
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Run AI reviewer
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          GITHUB_EVENT_PATH: ${{ github.event_path }}
          GITHUB_PR_NUMBER: ${{ inputs.pr_number }}
          OPENAI_REVIEW_MODEL: gpt-4o-mini
        run: node ./scripts/ai-pr-reviewer.mjs
